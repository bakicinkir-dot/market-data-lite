<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kamera">
<title>Kamera Kontrol</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #eee; font: 16px -apple-system, system-ui, sans-serif;
         min-height: 100dvh; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  video { width: 100%; flex: 1; min-height: 0; object-fit: contain; background: #111; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
  button, select { font: inherit; padding: 12px 14px; border-radius: 12px; border: 0; background: #2a2a2e; color: #fff; }
  button.primary { background: #0a84ff; }
  button.rec { background: #ff453a; }
  button:disabled { opacity: .4; }
  #log { padding: 0 16px 12px; font-size: 13px; color: #9a9aa0; white-space: pre-wrap; max-height: 20vh; overflow: auto; }
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div id="bar">
  <button id="start" class="primary">Kamerayı aç</button>
  <button id="flip" disabled>Ön/Arka</button>
  <select id="res" disabled>
    <option value="640x480">640×480</option>
    <option value="1280x720" selected>1280×720</option>
    <option value="1920x1080">1920×1080</option>
  </select>
  <button id="shot" disabled>Fotoğraf</button>
  <button id="rec" disabled>Kayıt</button>
  <button id="stop" disabled>Kapat</button>
</div>
<pre id="log"></pre>

<script>
const $ = id => document.getElementById(id);
const video = $('v'), logEl = $('log');
let stream = null, facing = 'environment', recorder = null, chunks = [];

const log = m => { logEl.textContent = m + '\n' + logEl.textContent; };

function setUi(on) {
  ['flip', 'res', 'shot', 'rec', 'stop'].forEach(i => $(i).disabled = !on);
  $('start').disabled = on;
}

async function open() {
  close();
  const [w, h] = $('res').value.split('x').map(Number);
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: w }, height: { ideal: h } }
    });
  } catch (e) { log('Kamera açılamadı: ' + e.name + ' — ' + e.message); return; }
  video.srcObject = stream;
  setUi(true);
  const s = stream.getVideoTracks()[0].getSettings();
  log(`Açık: ${s.width}×${s.height} @${Math.round(s.frameRate || 0)}fps (${facing})`);
}

function close() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null; setUi(false);
}

// Dosyayı paylaşım menüsüne ver (iOS'ta "Görüntüyü Kaydet" ile Fotoğraflar'a gider); olmazsa indir.
async function deliver(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

async function photo() {
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
  log(`Fotoğraf: ${c.width}×${c.height}, ${(blob.size / 1024) | 0} KB`);
  deliver(blob, `foto-${Date.now()}.jpg`);
}

function toggleRecord() {
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  chunks = [];
  recorder = new MediaRecorder(stream);            // iOS 14.3+ (mp4)
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    $('rec').textContent = 'Kayıt'; $('rec').classList.remove('rec');
    const blob = new Blob(chunks, { type: recorder.mimeType || 'video/mp4' });
    log(`Video: ${(blob.size / 1048576).toFixed(1)} MB`);
    deliver(blob, `video-${Date.now()}.mp4`);
  };
  recorder.start();
  $('rec').textContent = 'Durdur'; $('rec').classList.add('rec');
}

$('start').onclick = open;
$('stop').onclick = () => { close(); log('Kapatıldı'); };
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; open(); };
$('res').onchange = open;
$('shot').onclick = photo;
$('rec').onclick = toggleRecord;
document.addEventListener('visibilitychange', () => { if (document.hidden) close(); });

if (!navigator.mediaDevices) log('Bu sayfa HTTPS üzerinden açılmalı (getUserMedia yok).');
</script>
</body>
</html>
